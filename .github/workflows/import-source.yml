name: Publish Velora source tree
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify and publish the reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'b5c8ca6df2eb289eb82b271eff3d597c1569ba86eeeda54212f762d9ecaa50e3  Velora-source.zip' | sha256sum -c -
          unzip -q Velora-source.zip -d "$RUNNER_TEMP/velora-source"
          cp -a "$RUNNER_TEMP/velora-source/Velora/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src electron mcp docs build assets .gitignore .gitattributes package.json package-lock.json tsconfig.json vite.config.ts index.html electron-builder.yml README.md README.ko.md THIRD-PARTY-NOTICES.txt build-windows.cmd
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add creative design tools, embedded TTF fonts and GIF export'
          git push origin HEAD:main
